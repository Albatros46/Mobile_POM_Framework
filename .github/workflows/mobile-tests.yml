name: Mobile Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn -B test -Dgroups=unit

  android:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: bash scripts/download-apps.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            nohup npx appium --port 4723 > appium-android.log 2>&1 &
            for i in $(seq 1 30); do curl -sf http://127.0.0.1:4723/status > /dev/null && break; sleep 2; done
            mvn -B test -Dplatform=android -DexcludedGroups=unit
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-results
          path: |
            target/surefire-reports
            target/evidence
            appium-android.log
          retention-days: 14
          if-no-files-found: ignore

  ios:
    needs: unit
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: bash scripts/download-apps.sh
      - run: xcrun simctl list devices available
      - run: |
          nohup npx appium --port 4723 > appium-ios.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4723/status > /dev/null && break; sleep 2; done
          mvn -B test -Dplatform=ios -Dios.device="iPhone 16" -Dwait.seconds=60 -Devidence.print=true -DexcludedGroups=unit
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-results
          path: |
            target/surefire-reports
            target/evidence
            appium-ios.log
          retention-days: 14
          if-no-files-found: ignore
